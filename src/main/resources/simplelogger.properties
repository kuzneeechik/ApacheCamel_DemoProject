# Unified, compact logs for the live demo.
org.slf4j.simpleLogger.defaultLogLevel=info
org.slf4j.simpleLogger.showDateTime=false
org.slf4j.simpleLogger.showThreadName=false
org.slf4j.simpleLogger.showLogName=false
org.slf4j.simpleLogger.showShortLogName=true
# Camel's full exhausted-message stacktrace obscures the demo outcome.
# The exception is still thrown to Main and visible in the debugger.
org.slf4j.simpleLogger.log.org.apache.camel.processor.errorhandler.DefaultErrorHandler=off
org.slf4j.simpleLogger.log.org.apache.camel.impl.engine.AbstractCamelContext=warn
